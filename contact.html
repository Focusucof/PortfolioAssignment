<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="full.css" type="text/css" media="only screen and (min-width: 960px)">
    <link rel="stylesheet" href="tablet.css" type="text/css"
        media="only screen and (min-width: 481px) and (max-width: 959px)">
    <link rel="stylesheet" href="mobile.css" type="text/css" media="only screen and (max-width: 480px)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <nav class="navbar">
                <a href="index.html" class="logo"><img src="pfp.png" alt="Logo" class="logo-img"></a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>
        <section id="contact">
            <h1>Get In <span class="highlight">Touch</span></h1>
            <form action="mailto:devin.boodoo@ontariotechu.net" method="post" enctype="text/plain" name="form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="message" id="message-label">Message</label>
                <textarea id="message" name="message" maxlength="500" required></textarea>

                <button type="submit" class="submit">Send</button>
            </form>
        </section>


    </div>
    <footer>

    </footer>
</body>
